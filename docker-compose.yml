services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uptime
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/uptime
      DB_USER: uptime
      DB_PASSWORD: uptime
      # ALERT_WEBHOOK_URL: https://hooks.slack.com/services/...   (optional)
    ports:
      - "8080:8080"

volumes:
  pgdata:
